name: Build
permissions:
  contents: read

on:
  push:
    branches: ["dev", "production"]
  pull_request:
    branches: ["dev", "production"]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: article authors/dates come from git log in the articles
          # submodule. A shallow checkout leaves generateStaticParams empty and
          # fails Cache Components builds for /authors/[handle].
          fetch-depth: 0
          # Initialize articles/ + glossary/ before content-cache key resolution so
          # we don't depend on postinstall for submodule SHAs.
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Resolve content input SHAs
        id: content-inputs
        run: |
          echo "articles=$(git -C articles rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "glossary=$(git -C glossary rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache content artifacts
        id: cache-content
        uses: actions/cache@v5
        with:
          path: |
            data/manifest.json
            data/articles
            data/pdf-html
            data/.shiki-cache.json
            data/glossary*.json
            public/gtmc-en.pdf
            public/gtmc-zh.pdf
          # Hash dependency resolution plus generators/libs that feed content/PDF
          # artifacts so generated locale indexes cannot outlive their Pinyin data.
          key: content-${{ steps.content-inputs.outputs.articles }}-${{ steps.content-inputs.outputs.glossary }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'scripts/build-content.ts', 'scripts/generate-article-manifest.ts', 'scripts/generate-glossary-manifest.ts', 'scripts/generate-article-content.ts', 'scripts/generate-pdf.ts', 'scripts/manifest-preview.ts', 'scripts/lib/run.ts', 'lib/articles/**', 'lib/pdf/**', 'lib/glossary/**', 'lib/markdown/**') }}
          restore-keys: |
            content-${{ steps.content-inputs.outputs.articles }}-${{ steps.content-inputs.outputs.glossary }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Submodules already checked out; skip prisma/manifest/chromium here.
          # Prisma runs next; Chromium only when content must be rebuilt.
          GTMC_SKIP_POSTINSTALL: "1"

      - name: Generate Prisma Client
        run: pnpm prisma generate
        env:
          DATABASE_URL: "postgresql://localhost:5432/placeholder"

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        if: steps.cache-content.outputs.cache-hit != 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.cache-content.outputs.cache-hit != 'true' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Build
        env:
          # Only skip when the exact key hits — partial restore-keys may lack locale PDFs.
          GTMC_SKIP_CONTENT_BUILD: ${{ steps.cache-content.outputs.cache-hit == 'true' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node --run build

      - name: Upload compiled PDFs
        uses: actions/upload-artifact@v7
        with:
          name: gtmc-pdfs
          path: |
            public/gtmc-en.pdf
            public/gtmc-zh.pdf
          if-no-files-found: error
          retention-days: 14
