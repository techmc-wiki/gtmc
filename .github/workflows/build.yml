name: Build
permissions:
  contents: read

on:
  push:
    branches: ["dev", "production"]
  pull_request:
    branches: ["dev", "production"]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: article authors/dates come from git log in the articles
          # submodule. A shallow checkout leaves generateStaticParams empty and
          # fails Cache Components builds for /authors/[handle].
          fetch-depth: 0
          # Initialize content/articles + content/glossary before content-cache
          # key resolution so we don't depend on postinstall for submodule SHAs.
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Resolve content input SHAs
        id: content-inputs
        run: |
          echo "articles=$(git -C content/articles rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "glossary=$(git -C content/glossary rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache content artifacts
        id: cache-content
        uses: actions/cache@v5
        with:
          path: |
            apps/web/data/manifest.json
            apps/web/data/articles
            apps/web/data/pdf-html
            apps/web/data/.shiki-cache.json
            apps/web/data/glossary*.json
            apps/web/data/repository-contributor-stats.json
            apps/web/data/contributing
            apps/web/public/article-assets
          # Hash dependency resolution plus generators/libs that feed content
          # artifacts. Paths are workspace-relative: the app is apps/web, the
          # lockfile is shared at the root.
          key: content-${{ steps.content-inputs.outputs.articles }}-${{ steps.content-inputs.outputs.glossary }}-${{ hashFiles('package.json', 'CONTRIBUTING.md', 'apps/web/package.json', 'pnpm-lock.yaml', 'apps/web/scripts/build-content.ts', 'apps/web/scripts/generate-article-manifest.ts', 'apps/web/scripts/generate-glossary-manifest.ts', 'apps/web/scripts/generate-repository-contributor-stats.ts', 'apps/web/scripts/generate-article-content.ts', 'apps/web/scripts/stage-draft-guides.ts', 'apps/web/scripts/manifest-preview.ts', 'apps/web/scripts/lib/run.ts', 'apps/web/lib/articles/**', 'apps/web/lib/glossary/**', 'apps/web/lib/git/**', 'apps/web/lib/markdown/**') }}
          restore-keys: |
            content-${{ steps.content-inputs.outputs.articles }}-${{ steps.content-inputs.outputs.glossary }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Submodules are already checked out; skip install-time generation.
          GTMC_SKIP_POSTINSTALL: "1"

      - name: Generate Prisma Client
        # prisma is a devDependency of @gtmc/web; run it in its workspace.
        working-directory: apps/web
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: "postgresql://localhost:5432/placeholder"

      - name: Build
        env:
          # Only skip when the exact content cache key hits.
          GTMC_SKIP_CONTENT_BUILD: ${{ steps.cache-content.outputs.cache-hit == 'true' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node --run build
