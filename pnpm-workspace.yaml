# Workspace members. `tools/*` is intentionally absent: the PDF renderer in
# tools/pdf is a standalone sidecar with its own lockfile, so that site installs
# and deploys never pull in its renderer dependencies.
packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  esbuild: true
  prisma: true
